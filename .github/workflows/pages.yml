name: Tests und Veröffentlichung

# Bei jedem Push auf main: erst alle Tests, nur bei Erfolg wird veröffentlicht.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read   # nur zum Nachsehen, ob das Paket schon in der Artefaktliste steht

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Nur ausgelieferte Dateien zusammenstellen
        run: |
          mkdir site
          cp -r index.html manifest.webmanifest sw.js icons css data js site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # GitHub zeigt das hochgeladene Paket manchmal erst einen Moment später in der Artefaktliste an;
      # dann scheitert deploy-pages mit „Found 0 artifact(s)“. Darum erst nachsehen (höchstens eine Minute).
      - name: Warten, bis das Paket in der Artefaktliste steht
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 12); do
            n=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '[.artifacts[] | select(.name=="github-pages")] | length')
            echo "Versuch $i: $n Paket(e) gefunden"
            [ "$n" -ge 1 ] && exit 0
            sleep 5
          done
          echo "Das Paket steht noch nicht in der Liste; deploy-pages versucht es trotzdem."
      - id: deployment
        uses: actions/deploy-pages@v4
